[tool.poetry]
name = "job_agent"
version = "0.1.0"
description = "Automated job search pipeline: scrape, LLM cascade filter, tailored CV and cover letter, review UI. Driven by one candidate profile file."
authors = ["The ai-job-agent authors"]
license = "MIT"
readme = "README.md"
packages = [{include = "job_agent", from = "src"}]

[tool.poetry.dependencies]
python = "^3.11"
python-jobspy = "^1.1.82"

crawl4ai = "^0.9.2"
playwright = "^1.60.0"
scrapling = "^0.3.11"   # capped <0.4 until 0.4's API is validated against the ZipRecruiter flow (lxml deadlock resolved 2026-07-17)
openai = ">=1.55.0"
click = "^8.1.7"
pandas = "^2.3.3"
pypdf = ">=5.1.0"
python-docx = "^1.1.2"
rich = ">=13.9.4"
python-dotenv = "^1.0.1"
gspread = "^6.1.4"
oauth2client = "^4.1.3"
gspread-formatting = "^1.2.0"
cloudscraper = "^1.2.71"
google-api-python-client = "^2.155.0"
google-auth-oauthlib = "^1.2.1"
google-auth-httplib2 = "^0.2.0"
google-generativeai = "^0.8.3"
anthropic = ">=0.105.2"
PyYAML = "^6.0"
beautifulsoup4 = "^4.14.3" # For parsing HTML (Scrapling)
pytz = ">=2024.1" # Timezone handling
lxml = ">=6.1,<7" # >=6.1 fixes GHSA-vfmq-68hx-4jfw XXE; crawl4ai 0.9.2 allows <7
jsonschema = "^4.20.0" # JSON schema validation for job matcher
praw = "^7.7" # Reddit API for scraping r/forhire et al

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
search = "job_agent.main:cli"
