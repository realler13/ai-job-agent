rules:
  candidate_summary: >-
    The candidate is a hands-on PRODUCER — a mid-level individual contributor in video,
    documentary, branded content and studio broadcast. She plans, budgets, schedules, books
    crews and vendors, and delivers finished productions. She is based in Seattle and works
    on-site in the Seattle metro or remote for US-based employers; on-site in the Portland
    metro is acceptable but a weaker option. She has 11+ years of production experience and
    targets individual-contributor roles with no direct reports.
  target_roles: |-
    STRONG TARGET (top tier): mid-level individual-contributor production —
    Producer, Senior Producer (IC), Associate Producer, Lead Producer, Line
    Producer, hands-on Production Manager (owning schedules/budgets/vendors,
    not people). Associate Producer is a legitimate target level, NOT junior.

    BELOW-LEVEL WALL: entry-level roles (coordinator-level, assistant, trainee,
    or a posting whose experience requirement tops out at 0-2 years) sit below
    the target level → REJECT. A title that co-names a producer role is judged
    on the description.
  seniority_rule: |-
    PEOPLE-MANAGEMENT TEST (run FIRST): scan the DESCRIPTION, not the title, for
    explicit direct-report language — "manage a team of", "hire", "headcount",
    "direct reports", "performance reviews". If the role's CORE is people
    management, REJECT: the target level is individual-contributor with no
    direct reports, however production-relevant the title looks. An org-level
    executive title (VP / SVP / Chief / Head of <function>) is people
    management by definition → also REJECT.

    The hands-on exception (a REAL match, not a reject) holds only when the role
    owns SCHEDULES / BUDGETS / VENDORS / DELIVERABLES with NO team to manage —
    "collaborate with the team" is NOT people management.

    LEADERSHIP-TITLE CAP: an over-leveled or ambiguous leadership TITLE
    (Principal / Lead / Executive Producer) with NO direct-report evidence is AT
    MOST the lower tier — keep it visible, it may be an inflated title on a
    hands-on job; do NOT reject on the title alone.

    DIRECTOR DISAMBIGUATION: "Director" has three readings, and your reasoning
    must NAME which one the JD shows. (a) ORG-SENIORITY Director (owns strategy,
    teams, departmental budgets) → REJECT. (b) CRAFT Director (film/video
    director, art director, creative director — directs the creative work itself)
    → REJECT. (c) INFLATED TITLE on hands-on IC work, evidenced by
    schedules/budgets/vendors duties → lower tier. Readings (a) and (b) are
    REJECT, never "capped": the leadership-title cap does NOT apply to Director
    titles, and naming (a) or (b) and then keeping the role is the exact
    contradiction the verdict-binding rule forbids. A Director title with an EMPTY
    or stub description has no evidence for (c) and is a REJECT — the general
    "insufficient description → ambiguous, keep visible" branch does not apply to
    Director titles.
  craft_rule: |-
    CRAFT-SPECIALIST TEST: REJECT when the core deliverable is personally
    executing a craft (editing, shooting, design, sound) instead of producing:
      - Motion Designer / Animator / 3D Artist
      - Videographer / Camera Operator
      - Video Editor as the primary job
      - Graphic / Visual Designer / Illustrator
      - Sound or Audio Engineer / Mixer
      - Physical event labour — stagehand, set construction, fabrication
    The creative-craft LEADERSHIP ladder (Creative Director, Associate Creative
    Director, Art Director, Design Director) is a different profession → REJECT.

    HYBRID EXCEPTION (EVIDENCE-GATED): hybrid status requires the DESCRIPTION to
    show real coordination duties — schedules, budgets, vendors, crew booking — as
    a SUBSTANTIAL half. A slash-title or the bare word "producer" is NOT evidence;
    if the day-to-day is operating the craft, it is a craft REJECT.
  industry_rule: |-
    PREFERRED INDUSTRIES: media, entertainment, streaming, gaming, the creator
    economy, non-profit and public media, and in-house brand studios.

    MARKETING-EVENTS WALL: corporate-marketing event roles (field marketing,
    tradeshows, lead-generation events) → REJECT unless the description shows
    produced-show duties. An events-sounding title does NOT rescue these: only
    produced-show duties do (run-of-show, staging, AV/broadcast production,
    filming, editorial output).

    GOVERNMENT / DEFENSE WALL: roles supporting government, defense or military
    programmes → REJECT even when the function reads as event or production
    coordination — a different market from media production.
  reject_rules: |-
    SOCIAL-MEDIA / GROWTH TRAP: REJECT if the core is community management,
    posting schedules, analytics/growth hacking, or copywriting dressed up as
    "Content Strategist". ACCEPT producing content (video, audio, broadcast),
    production ops, budgets and schedules, creative operations, studio
    operations, media program/project management, or post-production.

    TECH-PM TRAP: this search targets production roles; engineering and software
    work is outside the target profile. REJECT Technical Program/Project Manager
    roles with engineering oversight, anything requiring AWS / Kubernetes / CI-CD /
    SQL / Python / microservices, and "Product Manager" roles (a different career
    track). ACCEPT Project/Program Manager ONLY in media, entertainment, creative
    or content-production contexts.

    BUSINESS CAP: account / client / partner management or revenue ownership is AT
    MOST the lower tier; REJECT outright when there is no production component.

    ALSO REJECT: interns, unpaid or volunteer roles, 0-1-year-experience-only
    postings, one-person-band videographer roles, video-GAME development producers
    (shipping the game itself), music producers (recording artists), and
    insurance/financial "producers".

    OVERQUALIFIED EXCEPTION: accept junior titles at recognisable organisations
    (major studios, streamers, public broadcasters, leading tech firms, well-known
    universities) when the domain matches — mark these "overqualified but
    strategic fit". This exception NEVER applies to coordinator-level, assistant,
    trainee or 0-2-year roles: those are REJECT under the BELOW-LEVEL WALL.

    VERDICT-BINDING (hard override, applies to every rule above): your verdict
    MUST follow your own reasoning. If your analysis identifies ANY enumerated
    reject condition, the verdict IS reject. Do NOT soften a disqualifier you
    yourself named into the lower tier. The lower tier exists for exactly two
    cases: a genuinely adjacent role with a SOFT gap, and a genuinely ambiguous
    description. Writing "outside the candidate's domain" or "not
    production-focused" and then keeping the role is a contradiction — resolve it
    as a reject.
