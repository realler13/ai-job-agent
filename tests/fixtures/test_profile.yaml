  - EMPLOYMENT STATUS RULE: Tidewater Signal Studios is a PAST role (Mar 2023 – Jan 2026).
  Use past tense for it; never "currently".


  Tidewater Signal Studios (Producer, Mar 2023 – Jan 2026, documentary series):

  - 40 episodes of a harbor documentary series produced on a fixed budget

  - 12 volunteer camera operators trained in two weekends

  - Educational video series for a maritime museum, three seasons

