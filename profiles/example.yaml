# ─────────────────────────────────────────────────────────────────────────────
# Example candidate profile — FICTIONAL.
#
# Maya Okonkwo, her employers and every number below are invented. This file
# is what the agent knows about who is job hunting: identity, search area,
# keywords, verified metrics and the candidate summary all come from here.
#
#   cp profiles/example.yaml profiles/profile.yaml   # gitignored
#   $EDITOR profiles/profile.yaml
#
# Sections:
#   candidate            identity and pronouns (document headers come from env vars)
#   paths                where your resume / base CV / notes live
#   search               locations, keywords, exclusions, staleness
#   metrics_text         the ONLY numbers generators may use
#   rules                the judgement policy, in plain English
#   application_answers  boilerplate for application forms
#   domains              one base-CV variant per keyword category
#
# How `rules` is used: `candidate_summary` is injected into the grading
# prompts. The other entries (target_roles, seniority_rule, craft_rule,
# industry_rule, reject_rules) are available to prompts as profile markers;
# the shipped cascade prompts (config.py, gpt_filter.py) spell the same policy
# out for a production-role search, so keep the two in step when you change
# one.
# ─────────────────────────────────────────────────────────────────────────────

