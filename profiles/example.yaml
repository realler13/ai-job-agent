  - 8+ years producing video and branded content (CANONICAL years figure — always state "8+
  years"; never a larger number)

  - EMPLOYMENT STATUS RULE: Northgate Media is a PAST role (Apr 2021 – Aug 2025). Use past
  tense for it; never "currently".


  Northgate Media (Senior Producer, Apr 2021 – Aug 2025, documentary & branded series):

  - 120+ episodes delivered across three series

  - Post schedule cut from 6 to 4 weeks per episode

  - 20+ freelance crew and post contributors booked per season (editors, sound, colourists)

  - $250K annual production budget owned, reconciled monthly


  Cascade Public Broadcasting (Producer, Aug 2018 – Mar 2021):

  - 3 weekly studio programmes produced end to end

  - Two programmes renewed for a third season

  - 9-person crews on location shoots; full vendor and location negotiation


